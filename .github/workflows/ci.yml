name: Java CI com Docker e Postgres

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Inicia um contêiner PostgreSQL de forma temporária para rodar os testes de integração
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Garante que o PostgreSQL esteja saudável antes de iniciar os passos
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"

    steps:
      # 1. Faz o checkout do código do repositório para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java para compilação e teste local
      - name: Configurar o JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'   # Altere de '17' para '21'
          distribution: 'temurin'
          cache: maven

      # 3. Roda os testes com o Maven apontando para o banco de dados Postgres ativo
      - name: Executar Testes Unitários e de Integração
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password

      # 4. Faz login de segurança no Docker Hub (Somente se os testes acima passarem!)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Constrói a imagem Docker e envia ao registro (Push) usando tags seguras
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true 
          # Gera a tag "latest" e uma tag única usando o hash identificador do commit do GitHub
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/meu-app-java:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/meu-app-java:${{ github.sha }}